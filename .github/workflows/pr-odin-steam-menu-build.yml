name: Verify Odin Steam Menu ARM64 Build

on:
  pull_request:
    branches: [odin-armadaos]
    paths:
      - "src/yuzu/main_window.cpp"
      - "src/yuzu/main.ui"
      - "scripts/steam-integration.py"
      - "scripts/steam_artwork.py"
      - ".github/workflows/pr-odin-steam-menu-build.yml"

permissions:
  contents: read

jobs:
  compile-native-steam-menu:
    name: Native ARM64 AppImage and tar.gz
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out fork source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt6 ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: odin-cpm-aarch64-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: odin-cpm-aarch64-

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build/odin-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON -DCMAKE_CXX_FLAGS=-Wno-error=shadow \
            -DLICHII_BUILD_PLATFORM=linux-aarch64 \
            -DLICHII_BUILD_TAG=odin-armadaos-${{ github.run_number }}

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build/odin-release --target yuzu yuzu-cmd --parallel 4
          test -x build/odin-release/bin/lichii
          test -x build/odin-release/bin/eden-cli
          test -f build/odin-release/bin/libnxformat.so
          readelf -h build/odin-release/bin/lichii | grep 'Machine:.*AArch64'

