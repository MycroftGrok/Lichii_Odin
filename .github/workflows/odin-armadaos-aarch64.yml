name: Odin ArmadaOS ARM64 Release

on:
  workflow_dispatch:
  push:
    branches: [odin-armadaos]
    paths:
      - ".github/workflows/odin-armadaos-aarch64.yml"
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"

permissions:
  contents: read

concurrency:
  group: odin-armadaos-aarch64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Native ARM64 AppImage and tar.gz
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Check out fork source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt6 ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: odin-cpm-aarch64-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: odin-cpm-aarch64-

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build/odin-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON -DCMAKE_CXX_FLAGS=-Wno-error=shadow \
            -DLICHII_BUILD_PLATFORM=linux-aarch64 \
            -DLICHII_BUILD_TAG=odin-armadaos-${{ github.run_number }}

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build/odin-release --target yuzu yuzu-cmd --parallel 4
          test -x build/odin-release/bin/lichii
          test -x build/odin-release/bin/eden-cli
          test -f build/odin-release/bin/libnxformat.so
          readelf -h build/odin-release/bin/lichii | grep 'Machine:.*AArch64'

      - name: Package AppImage and portable tarball
        run: |
          set -euo pipefail
          strip build/odin-release/bin/lichii build/odin-release/bin/eden-cli
          mkdir -p "$RUNNER_TEMP/linuxdeploy" AppDir/usr/bin
          arch="$(uname -m)"
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy/"*.AppImage
          cp build/odin-release/bin/nx2_switches.txt AppDir/usr/bin/
          cp dist/lichii.png "$RUNNER_TEMP/io.github.zortos293.lichii.png"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="odin-armadaos-$GITHUB_RUN_NUMBER"
          export LDAI_OUTPUT=lichii-odin-armadaos-aarch64.AppImage
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          "$RUNNER_TEMP/linuxdeploy/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/odin-release/bin/lichii \
            --executable build/odin-release/bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$RUNNER_TEMP/io.github.zortos293.lichii.png" \
            --plugin qt --output appimage
          test -s "$LDAI_OUTPUT"
          test -f AppDir/usr/lib/libnxformat.so
          test -f AppDir/usr/bin/qt.conf
          mv AppDir lichii
          ln -s usr/bin/lichii lichii/lichii
          ln -s usr/bin/eden-cli lichii/eden-cli
          tar -czf lichii-odin-armadaos-aarch64.tar.gz lichii
          sha256sum lichii-odin-armadaos-aarch64.tar.gz \
            lichii-odin-armadaos-aarch64.AppImage > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lichii-odin-armadaos-aarch64-${{ github.sha }}
          path: |
            lichii-odin-armadaos-aarch64.tar.gz
            lichii-odin-armadaos-aarch64.AppImage
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="odin-armadaos-build-$GITHUB_RUN_NUMBER"
          printf 'Experimental ARM64/ArmadaOS build of %s at %s.\n\nThis CI build has not been tested on an Odin. Existing working installations are never overwritten automatically.\n\nSHA256SUMS covers the AppImage and portable tar.gz. No games, keys or firmware included.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > notes.md
          gh release create "$tag" \
            lichii-odin-armadaos-aarch64.tar.gz \
            lichii-odin-armadaos-aarch64.AppImage \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Odin ARM64 experimental build $GITHUB_RUN_NUMBER" \
            --notes-file notes.md
