name: Steam Integration Regression Tests

on:
  push:
    branches:
      - feature/steam-integration-switch-collections-20261110
  pull_request:
    paths:
      - "scripts/steam-integration.py"
      - "scripts/tests/test_steam_integration.py"
      - "scripts/tests/test_steam_artwork.py"
      - "scripts/steam_artwork.py"
      - "scripts/install-launcher.sh"
      - "scripts/install-release.sh"
      - "src/yuzu/main_window.cpp"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax
        run: |
          python3 -m py_compile scripts/steam-integration.py scripts/steam_artwork.py scripts/tests/test_steam_integration.py scripts/tests/test_steam_artwork.py
      - name: Shell syntax
        run: |
          bash -n scripts/install-launcher.sh scripts/install-release.sh scripts/launch-odin.sh
      - name: Offline Steam shortcut/collection regression tests
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_steam_*.py' -v
